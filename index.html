<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CNAB Contas a Pagar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>/* Layout: cabeçalho com os dois logotipos, faixa de progresso, depois um cartão por frente de trabalho */
/* Tema único claro em lilás pastel, para não confundir com a página do Fluxo de Caixa (bege) */
:root{
  --bg:#efecf7;--card:#fbfaff;--deep:#e6e1f3;--border:#d3cbe6;--fg:#33304a;--strong:#1c1933;--muted:#6c6785;
  --gold:#5b4a9e;--gold-bg:#e0d9f5;--head:#cfc4ee;--head-line:#a898d8;--head-ink:#3f3180;
  --s-pend:#645f78;--s-and:#1d4ed8;--s-agu:#8a5a06;--s-ok:#15803d;--s-late:#b42318;
  --s-pend-bg:#e7e3f0;--s-and-bg:#dfe8fb;--s-agu-bg:#f8e7c2;--s-ok-bg:#dcf1e1;--s-late-bg:#fbe1dc;
  --display:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--head)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header.top{background:var(--head);border-bottom:2px solid var(--head-line);position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{width:54px;height:54px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px var(--border)}
.logo.cli{object-fit:contain;background:#fff}.logo.jes{object-fit:cover}
.tt{flex:1;min-width:0}
header.top .eyebrow{color:var(--head-ink)}
.jname{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;color:var(--head-ink);flex-shrink:0;margin-right:-4px}
@media(max-width:480px){.jname{font-size:13px;letter-spacing:.04em}}
header.top .logo{box-shadow:0 0 0 2px #fff}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-size:22px;line-height:1.15;margin:2px 0 0;color:var(--strong);text-wrap:balance}
main{padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
.summary{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:18px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
@media(max-width:720px){.summary{grid-template-columns:minmax(0,1fr)}}
.pct{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;color:var(--strong);font-variant-numeric:tabular-nums}
.pct small{font-size:16px;color:var(--muted);font-weight:600;margin-left:6px}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--deep);border:1px solid var(--border)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.legend b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;color:var(--muted);padding:7px 12px;font:600 12px var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--gold-bg);color:var(--gold)}
.save{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.btn{font:600 13px var(--body);border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--fg)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.area{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.area-h{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--deep);border-bottom:1px solid var(--border)}
.area-h h2{font-family:var(--display);font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:0;color:var(--strong);flex:1;min-width:0}
.area-h .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item{display:grid;grid-template-columns:4px minmax(0,1fr);border-top:1px solid var(--border)}
.item:first-of-type{border-top:0}
.stripe{background:var(--s-pend)}
.ib{padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ir{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ititle{flex:1 1 280px;min-width:0;font-size:15px;font-weight:600;color:var(--strong)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;white-space:nowrap}
.fields{display:grid;grid-template-columns:170px 170px 140px minmax(0,1fr);gap:10px}
@media(max-width:820px){.fields{grid-template-columns:1fr 1fr}.fields .obs{grid-column:1/-1}}
@media(max-width:420px){.fields{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f select,.f input,.f textarea{font:13px var(--body);color:var(--fg);background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 10px;width:100%}
.f textarea{resize:vertical;min-height:36px;height:36px}
.f input[type=date]{font-family:var(--mono);font-size:12.5px}
.foot{display:flex;gap:12px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.foot .x{margin-left:auto;background:none;border:0;color:var(--muted);font:12px var(--body);cursor:pointer;padding:2px 4px}
.foot .x:hover{color:var(--s-late)}
.foot .x.arm{color:var(--s-late);font-weight:600}
.add{padding:10px 18px;border-top:1px dashed var(--border);display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 240px;min-width:0;font:13px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 10px}
.add button{font:600 12px var(--body)}
.ro{font-size:12px;color:var(--s-agu);background:var(--s-agu-bg);border-radius:8px;padding:8px 12px}
.empty{padding:16px 18px;color:var(--muted);font-size:13px}
@media(prefers-reduced-motion:no-preference){.stack i{transition:width .4s}}
.who{font-size:12px;color:var(--muted)}.who b{color:var(--fg)}
.note{font-size:13px;border-radius:8px;padding:9px 14px;background:var(--s-agu-bg);color:var(--s-agu)}
.note.ok{background:var(--s-ok-bg);color:var(--s-ok)}.note.err{background:var(--s-late-bg);color:var(--s-late)}
.cfg{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.cfg h3{font-family:var(--display);font-size:16px;margin:0;color:var(--strong)}
.cfg p{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
.cfg-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cfg-g .wide{grid-column:1/-1}
@media(max-width:720px){.cfg-g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:420px){.cfg-g{grid-template-columns:minmax(0,1fr)}}
.cfg-a{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{font-size:13px;color:var(--gold)}
.f select:disabled,.f input:disabled,.f textarea:disabled{opacity:1;background:transparent;border-color:transparent;padding-left:0;color:var(--fg);-webkit-text-fill-color:var(--fg)}
.f textarea:disabled{resize:none}
.emps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px;padding:14px 18px}
.ck{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);cursor:pointer;min-height:30px}
.ck input{width:17px;height:17px;margin:0;accent-color:var(--gold);flex-shrink:0;cursor:pointer}
.ck input:disabled{cursor:default}
.ck .cod{font-family:var(--mono);font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;background:var(--deep);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.ckd{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.checks select,.checks input[type=date]{font:13px var(--body);color:var(--fg);background:#fff;border:1px solid var(--border);border-radius:7px;padding:5px 8px}
.checks input[type=date]{font-family:var(--mono);font-size:12.5px}
.checks select:disabled,.checks input[type=date]:disabled{opacity:1;background:transparent;border-color:transparent;color:var(--fg);-webkit-text-fill-color:var(--fg)}
.hold{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.hl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.hc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 4px;font-size:13px;cursor:pointer;background:#fff;min-height:32px}
.hc.on{background:var(--gold-bg);border-color:var(--gold);color:var(--strong);font-weight:600}
.hc img,.hc svg{width:24px;height:24px;border-radius:50%;background:#fff;flex-shrink:0}
.hc img{object-fit:cover}.hc img.cli{object-fit:contain}
.hc svg{padding:3px;color:var(--gold)}
.hc input{width:16px;height:16px;margin:0;accent-color:var(--gold);cursor:pointer}
.hc input:disabled{cursor:default}
.qt{display:inline-flex;align-items:center;gap:8px;font-size:13px}
</style></head><body>

  if(st===403)return"O token não tem permissão de escrita neste repositório.";
  if(st===404)return"Repositório ou arquivo não encontrado. Confira usuário, repositório e caminho em Acesso de editor.";
  if(st===409||st===422)return"Outra pessoa salvou antes de você. Clique em Atualizar do GitHub e refaça a alteração.";
  return"Não foi possível falar com o GitHub (código "+st+"). Tente novamente.";
}

/* ---- dados ---- */
function persist(){lsSet(LS,{base:saved.updated,state:state,dirty:dirty})}
function adopt(pub){
  saved=pub;var l=lsGet(LS),tb=Date.parse(l&&l.base),tp=Date.parse(pub.updated);
  if(l&&l.state&&l.dirty&&(l.base===pub.updated||(!isNaN(tb)&&!isNaN(tp)&&tb>=tp))){state=l.state;dirty=true}
  else{state=JSON.parse(JSON.stringify(pub));dirty=false;lsSet(LS,null)}
  norm();
}
function norm(){if(!state.empresas||typeof state.empresas!=="object")state.empresas={}}
function valid(d){return d&&Array.isArray(d.items)}
function readRemote(){
  if(cfg.owner&&cfg.repo){
    return fetch(api(filePath()+ref()),{headers:hdr(true),cache:"no-store"}).then(function(r){
      if(r.status===404)return null; if(!r.ok)throw r.status; return r.json();
    }).catch(function(){return fetch("dados.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})});
  }
  return fetch("dados.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
}
function checkAccess(){
  canWrite=false;who="";
  if(!cfg.token||!cfg.owner||!cfg.repo){render();return Promise.resolve()}
  return fetch(api(""),{headers:hdr(false),cache:"no-store"}).then(function(r){
    if(!r.ok)throw r.status;return r.json()}).then(function(j){
    canWrite=!!(j.permissions&&j.permissions.push);
    if(!canWrite){msg="Este token só tem acesso de leitura ao repositório.";msgKind="err"}
    return fetch("https://api.github.com/user",{headers:hdr(false)}).then(function(r){return r.ok?r.json():{}}).then(function(u){who=u.login||""});
  }).catch(function(st){msg=errText(typeof st==="number"?st:0);msgKind="err"}).then(render);
}
function utf8b64(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function saveGH(){
  if(!canWrite)return;
  busy=true;msg="Salvando no GitHub…";msgKind="";render();
  var out=JSON.parse(JSON.stringify(state));out.updated=new Date().toISOString();
  fetch(api(filePath()+ref()),{headers:hdr(false),cache:"no-store"}).then(function(r){
    if(r.status===404)return null;if(!r.ok)throw r.status;return r.json()}).then(function(cur){
    var body={message:"Atualiza tarefas do CNAB Contas a Pagar ("+new Date().toLocaleString("pt-BR")+")",content:utf8b64(JSON.stringify(out,null,2))};
    if(cur&&cur.sha)body.sha=cur.sha; if(cfg.branch)body.branch=cfg.branch;
    return fetch(api(filePath()),{method:"PUT",headers:Object.assign(hdr(false),{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  }).then(function(r){if(!r.ok)throw r.status;
    saved=out;state=JSON.parse(JSON.stringify(out));dirty=false;lsSet(LS,null);
    msg="Salvo no GitHub. O link público mostra a versão nova em até 1 minuto.";msgKind="ok";
  }).catch(function(st){msg=errText(typeof st==="number"?st:0);msgKind="err"}).then(function(){busy=false;render()});
}
function refreshGH(){
  busy=true;msg="Buscando a versão do GitHub…";msgKind="";render();
  readRemote().then(function(d){
    if(valid(d)){lsSet(LS,null);adopt(d);msg="Versão do GitHub carregada.";msgKind="ok"}
    else{msg="Ainda não existe dados.json no repositório. Salve pela primeira vez para criá-lo.";msgKind=""}
  }).then(function(){busy=false;armRefresh=false;render()});
}

/* ---- interface ---- */
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function br(d){if(!d)return"";var p=String(d).slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function late(it){return it.status!=="Concluído"&&it.due&&it.due<today()}
function cls(it){if(late(it))return"late";for(var i=0;i<ST.length;i++)if(ST[i].k===it.status)return ST[i].c;return"pend"}
function pill(it){var c=cls(it);return'<span class="pill" style="background:var(--s-'+c+'-bg);color:var(--s-'+c+')">'+esc(late(it)?"Atrasado · "+it.status:it.status)+"</span>"}
var app=document.getElementById("app");

var BANK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 3 8v2h18V8zM5 11v7h2v-7zm4 0v7h2v-7zm4 0v7h2v-7zm4 0v7h2v-7zM3 19v2h18v-2z"/></svg>';
var HOLD=[["banco","Banco"],["preserve","Preserve"],["jescipe","Jescipe"]];
function holdRow(it,dis){
  return'<div class="hold"><span class="hl">Em posse de</span>'+HOLD.map(function(o){
    var on=it.holder===o[0];
    var ic=o[0]==="banco"?BANK_SVG:'<img'+(o[0]==="preserve"?' class="cli"':'')+' src="'+(o[0]==="preserve"?LOGO_CLI:LOGO_JES)+'" alt="">';
    return'<label class="hc'+(on?' on':'')+'">'+ic+o[1]+'<input type="checkbox" id="h-'+o[0]+'-'+it.id+'" data-id="'+it.id+'" data-k="holder" data-v="'+o[0]+'"'+(on?' checked':'')+dis+'></label>'}).join('')+'</div>';
}
var QT=["01","02","03","04","05","06","07","08","09","10"];
function ck(it,k,lb,dis){return'<label class="ck"><input type="checkbox" id="k-'+k+'-'+it.id+'" data-id="'+it.id+'" data-k="'+k+'"'+(it[k]?' checked':'')+dis+'>'+lb+'</label>'}
function cfgPanel(){
  return'<section class="cfg"><h3>Acesso de editor</h3>'
  +'<p>Informe um token pessoal do GitHub com permissão de escrita em <b>Contents</b> neste repositório. Ele fica guardado só neste navegador e é enviado apenas para o GitHub.</p>'
  +'<div class="cfg-g">'
  +'<div class="f"><label for="c-owner">Usuário ou organização</label><input id="c-owner" value="'+esc(cfg.owner)+'"></div>'
  +'<div class="f"><label for="c-repo">Repositório</label><input id="c-repo" value="'+esc(cfg.repo)+'"></div>'
  +'<div class="f"><label for="c-branch">Branch (vazio = padrão)</label><input id="c-branch" value="'+esc(cfg.branch)+'"></div>'
  +'<div class="f"><label for="c-path">Caminho do arquivo</label><input id="c-path" value="'+esc(cfg.path)+'"></div>'
  +'<div class="f wide"><label for="c-token">Token</label><input id="c-token" type="password" autocomplete="off" placeholder="'+(cfg.token?'Token guardado (digite para trocar)':'github_pat_…')+'"></div>'
  +'</div><div class="cfg-a"><button class="btn pri" id="c-save">Salvar acesso</button>'
  +(cfg.token?'<button class="btn" id="c-out">Sair (apagar token)</button>':'')
  +'<button class="btn" id="c-close">Fechar</button>'
  +'<a class="lnk" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Gerar token no GitHub</a></div></section>';
}

function render(){
  var its=state.items, tot=its.length, ok=its.filter(function(i){return i.status==="Concluído"}).length;
  var pct=tot?Math.round(ok/tot*100):0;
  var counts=ST.map(function(s){return{s:s,n:its.filter(function(i){return i.status===s.k}).length}});
  var nLate=its.filter(late).length, ro=!canWrite;
  var h='<header class="top gut"><div class="wrap"><img class="logo cli" src="'+LOGO_CLI+'" alt="Preserve Liserve">'
    +'<div class="tt"><div class="eyebrow">Preserve · Protheus</div><h1>CNAB CONTAS A PAGAR</h1></div>'
    +'<span class="jname">JESCIPE</span><img class="logo jes" src="'+LOGO_JES+'" alt="Soluções em TI"></div></header>';
  h+='<main class="gut"><div class="wrap" style="display:flex;flex-direction:column;gap:18px">';
  h+='<section class="summary"><div><div class="pct">'+pct+'%<small>'+ok+' de '+tot+' concluídas</small></div>'
    +'<div class="meta">Última versão salva: '+br(saved.updated)+(nLate?' · <span style="color:var(--s-late);font-weight:600">'+nLate+' atrasada'+(nLate>1?'s':'')+'</span>':'')+'</div></div>'
    +'<div><div class="stack" role="img" aria-label="Distribuição por status">'
    +counts.map(function(c){return c.n?'<i style="width:'+(c.n/tot*100)+'%;background:var(--s-'+c.s.c+')"></i>':''}).join('')
    +'</div><div class="legend">'+counts.map(function(c){return'<span><i class="dot" style="background:var(--s-'+c.s.c+')"></i>'+c.s.k+' <b>'+c.n+'</b></span>'}).join('')+'</div></div></section>';
  h+='<div class="toolbar"><div class="seg" role="group" aria-label="Filtro">'
    +[["todas","Todas"],["abertas","Em aberto"],["atrasadas","Atrasadas"],["concluidas","Concluídas"]].map(function(f){return'<button id="f-'+f[0]+'" data-f="'+f[0]+'" class="'+(filter===f[0]?'on':'')+'">'+f[1]+'</button>'}).join('')
    +'</div><div class="sp"></div><div class="save">'
    +'<span class="who">'+(canWrite?'Editor'+(who?': <b>'+esc(who)+'</b>':''):'Modo visualização')+'</span>'
    +'<button class="btn" id="cfg">'+(canWrite?'Acesso':'Entrar como editor')+'</button>'
    +'<button class="btn" id="refresh" '+(busy?'disabled':'')+'>'+(armRefresh?'Confirmar: descartar e atualizar':'Atualizar do GitHub')+'</button>'
    +(canWrite?'<button class="btn pri" id="save" '+(dirty&&!busy?'':'disabled')+'>Salvar no GitHub</button>':'')
    +'</div></div>';
  if(showCfg)h+=cfgPanel();
  if(msg)h+='<div class="note '+msgKind+'" role="status">'+esc(msg)+'</div>';
  else if(dirty&&canWrite)h+='<div class="note">Há alterações ainda não salvas no GitHub. Clique em <b>Salvar no GitHub</b>.</div>';
  var nEmp=EMPRESAS.filter(function(e){return state.empresas[e[0]]}).length;
  h+='<section class="area"><div class="area-h"><h2>Empresas que terão o CNAB</h2><span class="n">'+nEmp+'/'+EMPRESAS.length+'</span></div><div class="emps">'
    +EMPRESAS.map(function(e){return'<label class="ck"><input type="checkbox" id="e-'+e[0]+'" data-emp="'+e[0]+'"'+(state.empresas[e[0]]?' checked':'')+(ro?' disabled':'')+'><span class="cod">'+e[0]+'</span>'+esc(e[1])+'</label>'}).join('')
    +'</div></section>';
  AREAS.forEach(function(a,ai){
    var all=its.filter(function(i){return i.area===a});
    var list=all.filter(function(i){
      if(filter==="abertas")return i.status!=="Concluído";
      if(filter==="atrasadas")return late(i);
      if(filter==="concluidas")return i.status==="Concluído";return true});
    if(filter!=="todas"&&!list.length)return;
    var done=all.filter(function(i){return i.status==="Concluído"}).length, dis=ro?' disabled':'';
    h+='<section class="area"><div class="area-h"><h2>'+esc(a)+'</h2><span class="n">'+done+'/'+all.length+'</span></div>';
    if(!list.length)h+='<div class="empty">Nenhum banco aqui.</div>';
    list.forEach(function(it){
      var c=cls(it);
      h+='<div class="item"><div class="stripe" style="background:var(--s-'+c+')"></div><div class="ib">'
        +'<div class="ir"><div class="ititle">'+esc(it.title)+'</div>'+pill(it)+'</div>'
        +holdRow(it,dis)
        +'<div class="fields">'
        +'<div class="f"><label for="s-'+it.id+'">Status</label><select id="s-'+it.id+'" data-id="'+it.id+'" data-k="status"'+dis+'>'+ST.map(function(s){return'<option'+(s.k===it.status?' selected':'')+'>'+s.k+'</option>'}).join('')+'</select></div>'
        +'<div class="f"><label for="o-'+it.id+'">Responsáveis</label><input id="o-'+it.id+'" data-id="'+it.id+'" data-k="owner" value="'+esc(it.owner)+'" placeholder="'+(ro?'—':'Nomes')+'"'+dis+'></div>'
        +'<div class="f"><label for="d-'+it.id+'">Prazo</label><input type="date" id="d-'+it.id+'" data-id="'+it.id+'" data-k="due" value="'+esc(it.due)+'"'+dis+'></div>'
        +'<div class="f obs"><label for="n-'+it.id+'">Observação</label><textarea id="n-'+it.id+'" data-id="'+it.id+'" data-k="note" placeholder="'+(ro?'—':'Andamento, contato, bloqueio…')+'"'+dis+'>'+esc(it.note)+'</textarea></div>'
        +'</div><div class="checks">'
        +ck(it,'envio','Layout envio',dis)+ck(it,'retorno','Layout retorno',dis)
        +'<span class="qt"><label for="q-'+it.id+'">Qtd. de contas</label><select id="q-'+it.id+'" data-id="'+it.id+'" data-k="qtd"'+dis+'><option value="">—</option>'+QT.map(function(q){return'<option'+(q===it.qtd?' selected':'')+'>'+q+'</option>'}).join('')+'</select></span>'
        +'<span class="ckd">'+ck(it,'valid','Validado',dis)+'<input type="date" id="vd-'+it.id+'" aria-label="Data da validação" data-id="'+it.id+'" data-k="validDate" value="'+esc(it.validDate)+'"'+dis+'></span>'
        +'<span class="ckd">'+ck(it,'dda','Retorno do DDA disponível',dis)+'<input type="date" id="dd-'+it.id+'" aria-label="Data do retorno do DDA" data-id="'+it.id+'" data-k="ddaDate" value="'+esc(it.ddaDate)+'"'+dis+'></span>'
        +'</div><div class="foot"><span>Atualizado em '+br(it.updatedAt)+'</span>'
        +(ro?'':'<button class="x'+(armed===it.id?' arm':'')+'" data-del="'+it.id+'">'+(armed===it.id?'Confirmar remoção':'Remover')+'</button>')+'</div>'
        +'</div></div>';
    });
    if(!ro)h+='<div class="add"><input id="add-'+ai+'" placeholder="Novo banco"><button class="btn" data-add="'+ai+'">Adicionar</button></div>';
    h+='</section>';
  });
  h+='</div></main>';
  var ae=document.activeElement,fa=ae&&ae.id,ss=null;
  try{if(fa&&ae.selectionStart!=null)ss=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  app.innerHTML=h;
  if(fa){var el=document.getElementById(fa);if(el){el.focus();if(ss)try{el.setSelectionRange(ss[0],ss[1])}catch(e){}}}
}
function find(id){return state.items.filter(function(i){return i.id===id})[0]}
function touch(){dirty=true;msg="";persist()}
app.addEventListener("input",function(e){
  var t=e.target,id=t.dataset.id;if(!canWrite)return;
  if(t.dataset.emp){state.empresas[t.dataset.emp]=t.checked;touch();render();return}
  if(!id)return;var it=find(id);if(!it)return;var k=t.dataset.k;
  if(k==="holder"){it.holder=t.checked?t.dataset.v:""}
  else if(t.type==="checkbox"){it[k]=t.checked;
    if(k==="valid"||k==="dda"){var dk=k+"Date";if(t.checked&&!it[dk])it[dk]=today();if(!t.checked)it[dk]=""}
  }else it[k]=t.value;
  it.updatedAt=today();touch();
  if(t.tagName==="SELECT"||t.type==="date"||t.type==="checkbox")render();
  else{var b=document.getElementById("save");if(b)b.disabled=busy}
});
app.addEventListener("change",function(e){if(e.target.dataset.id)render()});
app.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.f){filter=t.dataset.f;render();return}
  if(t.dataset.del){var id=t.dataset.del;if(armed===id){state.items=state.items.filter(function(i){return i.id!==id});armed=null;touch()}else armed=id;render();return}
  if(t.dataset.add){var inp=document.getElementById("add-"+t.dataset.add),v=inp.value.trim();if(!v)return;
    state.items.push({id:"i"+Date.now().toString(36),area:AREAS[+t.dataset.add],title:v,status:"Pendente",owner:"",due:"",note:"",envio:false,retorno:false,qtd:"",valid:false,validDate:"",dda:false,ddaDate:"",holder:"",updatedAt:today()});touch();render();return}
  if(t.id==="cfg"){showCfg=!showCfg;render();return}
  if(t.id==="c-close"){showCfg=false;render();return}
  if(t.id==="c-out"){delete cfg.token;lsSet(LSC,cfg);canWrite=false;who="";msg="Token apagado deste navegador.";msgKind="";render();return}
  if(t.id==="c-save"){
    ["owner","repo","branch","path"].forEach(function(k){cfg[k]=document.getElementById("c-"+k).value.trim()});
    if(!cfg.path)cfg.path="dados.json";
    var tk=document.getElementById("c-token").value.trim();if(tk)cfg.token=tk;
    lsSet(LSC,cfg);msg="";showCfg=false;
    checkAccess().then(function(){if(canWrite){msg="Acesso de editor confirmado.";msgKind="ok";render()}});return}
  if(t.id==="refresh"){if(dirty&&!armRefresh){armRefresh=true;render();return}refreshGH();return}
  if(t.id==="save")saveGH();
});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id&&e.target.id.indexOf("add-")===0){var b=e.target.nextElementSibling;if(b)b.click()}});

norm();adopt(saved);render();
readRemote().then(function(d){if(valid(d)){adopt(d);render()}});
checkAccess();
})();
</script>
</body></html>
